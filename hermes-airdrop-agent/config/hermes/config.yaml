model:
  provider: ${HAA_MODEL_PROVIDER}
  base_url: ${CUSTOM_BASE_URL}
  default: ${HAA_MODEL_DEFAULT}
  context_length: ${HAA_CONTEXT_LENGTH}
agent:
  max_turns: 150
  reasoning_effort: high
  stall_guards: true
  verify_guidance: true
toolsets:
- hermes-cli
- browser
- file
- skills
terminal:
  backend: local
  cwd: ${HAA_PROJECT_DIR}
  timeout: 180
browser:
  cdp_url: http://127.0.0.1:9222
  engine: chrome
  backend: 'off'
  headed: true
  inactivity_timeout: 900
  command_timeout: 90
  record_sessions: true
kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  auto_subscribe_on_create: true
  review_dispatch: true
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  progress_notices: true
approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  deny:
  - '*cast send*'
  - '*cast wallet*'
  - '*cast keystore*'
  - '*solana transfer*'
  - '*solana keygen*'
  - '*cleos*transfer*'
  - '*--private-key*'
  - '*--private_key*'
  - '*PRIVATE_KEY*'
  - '*mnemonic*'
  - '*seed phrase*'
  - '*google-chrome*'
  - '*google-chrome-stable*'
  - '*chromium*'
  - '*chromium-browser*'
  - '*firefox*'
  - '*brave-browser*'
  - '*microsoft-edge*'
  - '*--remote-debugging-port*'
  - '*--remote-allow-origins*'
  - '*Xvfb*'
  - '*xvfb-run*'
  - '*playwright*'
  - '*puppeteer*'
  - '*selenium*'
  - '*pkill*'
  - '*killall*'
security:
  redact_secrets: true
  allow_private_urls: false
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
skills:
  creation_nudge_interval: 15
cron:
  model: ${HAA_CRON_MODEL}
  model_drift_guard: true
  preflight: true
  max_parallel_jobs: 1
session_reset:
  mode: daily
  at_hour: 4
display:
  skin: default
  tool_progress: all
  show_reasoning: false
  timestamps: true
runtime:
  nofile_soft_limit: 4096
database:
  journal_mode: wal
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 4
    same_tool_failure: 6
    idempotent_no_progress: 4
