# ---------------------------------------------------------------------------
# worker-analyzer — scores candidate projects on the 4 dimensions.
# Installs to ~/.hermes/profiles/worker-analyzer/config.yaml
# Read-heavy, write-light. No wallet, no signing, no spend.
# ---------------------------------------------------------------------------
model:
  provider: auto
  default: ${HAA_ANALYZER_MODEL}   # strong model — this decision gates everything

agent:
  max_turns: 60
  reasoning_effort: high
  stall_guards: true
  verify_guidance: true

toolsets:
  - hermes-cli
  - browser          # the product must be *used* in a real browser to be rated
  - web
  - file
  - skills

terminal:
  backend: local
  cwd: ${HAA_PROJECT_DIR}
  timeout: 180

browser:
  cloud_provider: camofox
  backend: "off"            # Camofox has no CDP endpoint; keep built-in tools
  camofox:
    managed_persistence: true          # persistent Firefox profile per user_id
    user_id: haa-worker-analyzer             # stable per ROLE, so logins persist
    adopt_existing_tab: true           # reuse an open tab after a restart
  headed: true              # affects Hermes' local Chromium fallback only;
                            # ENABLE_VNC=1 in the container is what shows Camofox
  inactivity_timeout: 900   # 15 min — a claim flow must not be cut off
  command_timeout: 90
  record_sessions: true     # recordings are evidence

approvals:
  mode: smart
  cron_mode: deny
  single_query_mode: deny
  deny:
    - "*cast send*"
    - "*cast wallet*"
    - "*solana transfer*"
    - "*--private-key*"
    - "*--private_key*"
    - "*PRIVATE_KEY*"
    - "*mnemonic*"

security:
  redact_secrets: true
  allow_private_urls: false

compression:
  enabled: true
  threshold: 0.50
  protect_last_n: 20

session_reset:
  mode: daily
  at_hour: 4

tool_loop_guardrails:
  hard_stop_enabled: true
  warn_after:
    same_tool_failure: 3
  hard_stop_after:
    same_tool_failure: 6
