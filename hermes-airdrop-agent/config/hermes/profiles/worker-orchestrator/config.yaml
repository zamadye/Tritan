model:
  provider: ${HAA_MODEL_PROVIDER}
  base_url: ${CUSTOM_BASE_URL}
  # Key dibaca dari .env (CUSTOM_API_KEY). Untuk provider direct
  # (anthropic/openrouter) kosongkan baris ini dan isi *_API_KEY di .env.
  api_key: ${CUSTOM_API_KEY}
  default: ${HAA_MODEL_DEFAULT}
  context_length: ${HAA_CONTEXT_LENGTH}
agent:
  max_turns: 80
  reasoning_effort: high
  stall_guards: true
  verify_guidance: true
toolsets:
- hermes-cli
- browser
- delegation
- file
- skills
- kanban
terminal:
  backend: local
  cwd: ${HAA_PROJECT_DIR}
  timeout: 180
browser:
  cdp_url: http://127.0.0.1:9222
  engine: chrome
  backend: 'off'
  headed: true
  inactivity_timeout: 900
  command_timeout: 90
  record_sessions: true
approvals:
  mode: smart
  cron_mode: deny
  single_query_mode: deny
  deny:
  - '*cast send*'
  - '*cast wallet*'
  - '*cast keystore*'
  - '*solana transfer*'
  - '*solana keygen*'
  - '*--private-key*'
  - '*--private_key*'
  - '*PRIVATE_KEY*'
  - '*mnemonic*'
  - '*seed phrase*'
  - '*google-chrome*'
  - '*google-chrome-stable*'
  - '*chromium*'
  - '*chromium-browser*'
  - '*firefox*'
  - '*brave-browser*'
  - '*microsoft-edge*'
  - '*--remote-debugging-port*'
  - '*--remote-allow-origins*'
  - '*Xvfb*'
  - '*xvfb-run*'
  - '*playwright*'
  - '*puppeteer*'
  - '*selenium*'
  - '*pkill*'
  - '*killall*'
security:
  redact_secrets: true
  allow_private_urls: false
compression:
  enabled: true
  threshold: 0.5
  protect_last_n: 20
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
delegation:
  inherit_parent_model: false
session_reset:
  mode: idle
  idle_minutes: 240
tool_loop_guardrails:
  hard_stop_enabled: true
  warn_after:
    same_tool_failure: 3
  hard_stop_after:
    same_tool_failure: 6
